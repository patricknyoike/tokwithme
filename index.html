<!DOCTYPE html>
<html>
<head>
    <title>TokWithMe - Live Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0F0F0F;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 20px; }
        .logo {
            width: 100px; height: 100px;
            background: linear-gradient(135deg, #FE2C55, #25F4EE);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }
        .logo i { font-size: 50px; }
        button {
            background: linear-gradient(135deg, #FE2C55, #ff6b6b);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            width: 250px;
            text-align: center;
        }
        .status {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="logo">
        <i class="fas fa-comment-dots"></i>
    </div>
    <h1>TokWithMe</h1>
    <p style="color: #888; margin: 10px 0;">Real-time random chat</p>
    
    <input type="text" id="nickname" placeholder="Enter nickname" maxlength="20">
    <br>
    <button onclick="startChat()">Start Chatting</button>
    <div class="status" id="status">Enter a nickname to begin</div>
</div>

<script>
    let ws = null;
    let myId = null;
    let myName = null;
    
    function generateId() {
        return 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    }
    
    function startChat() {
        myName = document.getElementById('nickname').value.trim();
        if (!myName) {
            alert('Please enter a nickname');
            return;
        }
        
        myId = generateId();
        document.getElementById('status').innerHTML = 'Connecting...';
        
        ws = new WebSocket(`wss://${window.location.host}`);
        
        ws.onopen = () => {
            document.getElementById('status').innerHTML = 'Connected! Finding partner...';
            ws.send(JSON.stringify({ type: 'register', userId: myId, name: myName }));
            ws.send(JSON.stringify({ type: 'find_partner', userId: myId }));
        };
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            console.log('Received:', data);
            
            if (data.type === 'pair') {
                document.getElementById('status').innerHTML = `Connected with ${data.partnerName}! You can now chat.`;
                alert(`Connected with ${data.partnerName}!`);
            } else if (data.type === 'user_list') {
                console.log('Online users:', data.users.length);
            }
        };
        
        ws.onerror = () => {
            document.getElementById('status').innerHTML = 'Connection error. Retrying...';
            setTimeout(() => startChat(), 3000);
        };
        
        ws.onclose = () => {
            document.getElementById('status').innerHTML = 'Disconnected. Reconnecting...';
            setTimeout(() => startChat(), 3000);
        };
    }
</script>
</body>
</html>
